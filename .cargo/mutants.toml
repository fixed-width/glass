# Mutations no test can distinguish, with the reason each is unkillable rather than untested.
#
# The bar for a line here is that the mutant produces a program with *identical observable
# behaviour*. "Hard to test" is not enough: a deadline that only fires when the compositor is slow
# is reachable with fault injection, and stays gated.
#
# Match on the whole mutant description, so a pattern must name the function it belongs to.
# Anything broader silently takes real mutants with it — `replace >= with < in ...capture_frame`
# reads as one exclusion and is three, two of them genuine.
#
# One list rather than `#[mutants::skip]` attributes, so every exclusion is reviewed together and
# neither public crate takes a dependency to carry them.
exclude_re = [
    # Empty match arms: deleting one falls through to the `_ => {}` beside it, which does exactly
    # what the arm did. They are written out to record that the event was considered.
    'delete match arm zwlr_data_control_device_v1::Event::Finished',
    'delete match arm zwlr_data_control_device_v1::Event::PrimarySelection',

    # `start_app`'s retry guard, in the three forms that make it true on the last attempt as well.
    # Both routes out of that attempt return the same error and reap the private bus — the arm
    # does it before returning, and the line after the loop does it for an exhausted ladder — so
    # the programs are identical. The fourth form, `< with ==`, does change behaviour (it stops
    # the retry happening at all) and is caught by the launch test that measures the ladder.
    'replace < with <= in <impl Platform for WaylandPlatform>::start_app',
    'replace \+ with \* in <impl Platform for WaylandPlatform>::start_app',
    'replace match guard attempt \+ 1 < ATTEMPTS with true',
]
