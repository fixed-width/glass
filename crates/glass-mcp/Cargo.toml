[package]
name = "glass-mcp"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["network", "self-update"]
network = [
    "dep:axum",
    "dep:tower",
    "dep:tokio-util",
    "dep:futures",
    "rmcp/transport-streamable-http-server",
]
self-update = ["dep:reqwest"]

[dependencies]
directories.workspace = true
fs4.workspace = true
glass-android.workspace = true
glass-core.workspace = true
image.workspace = true
rmcp = { version = "2.2", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
base64 = "0.23"
anyhow = "1"
cap-std = "4"
cap-fs-ext = "4"
zip = { version = "8.6", default-features = false }
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tokio-util = { version = "0.7", optional = true }
# Non-optional: the untrusted-conduit nonce (untrusted.rs, compiled in every build,
# incl. --no-default-features) needs a CSPRNG, as does network token generation.
rand = { version = "0.10" }
# Audit log: SHA-256 content digests (redacted by default) + RFC3339 timestamps.
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = { version = "0.3", optional = true }
# `update`: the only outbound HTTP glass makes. reqwest rather than a lighter client because it
# is already in Cargo.lock (pinned to rmcp's line below) and hyper/http/tower/tokio are already
# linked via axum. Native roots rather than a bundled store so a TLS-inspecting corporate proxy
# works; a musl static build therefore needs ca-certificates present.
#
# reqwest 0.13 collapsed the old `rustls-tls*` feature split: `rustls` is now the only rustls
# feature, and it always pulls in `rustls-platform-verifier`, which verifies against the OS's own
# trust store (Keychain, CryptoAPI, or the system's ca-certificates) rather than a bundled webpki
# set.
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true
glass-x11 = { path = "../glass-x11" }
glass-wayland = { path = "../glass-wayland" }
glass-a11y-linux = { path = "../glass-a11y-linux" }
glass-dbus-linux = { path = "../glass-dbus-linux" }
glass-sandbox-linux.workspace = true

[target.'cfg(windows)'.dependencies]
glass-windows = { path = "../glass-windows" }
glass-a11y-windows = { path = "../glass-a11y-windows" }
windows = { version = "0.62", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
glass-macos = { path = "../glass-macos" }
glass-a11y-macos = { path = "../glass-a11y-macos" }
glass-sandbox-macos.workspace = true
# The iOS Simulator backend links `image`'s `png` codec chain (see glass-ios/Cargo.toml);
# macOS is the only host that can actually drive `xcrun simctl`, so keep that chain out of
# the Linux/Windows glass-mcp binary. glass-ios stays a workspace member either way — its
# own unit tests still run on every unix host.
glass-ios = { path = "../glass-ios" }
# `setup`'s `gui/<uid>` LaunchAgent install (`rustix::process::getuid`) — a safe syscall
# wrapper, so no `unsafe` FFI is needed for this. Already a workspace dependency (glass-macos
# uses it for process signals); the workspace-level `process` feature covers `getuid`.
rustix.workspace = true

[build-dependencies]
embed-manifest = "1"
# Already a normal dependency of this crate (above), so build.rs parsing server.json adds no
# crate to the lockfile — only a host-side build of one already in the graph.
serde_json = "1"

# Windows-host builds only: statically link just the VCRuntime, leaving the OS-provided
# Universal CRT dynamic (so it still gets Windows Update security fixes). Pairs with the
# `+crt-static` flag in .cargo/config.toml — metabuild() swaps the UCRT back to dynamic.
[target.'cfg(windows)'.build-dependencies]
static_vcruntime = "3.0"

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
rmcp = { version = "2.2", features = ["client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1", features = ["full", "test-util"] }
# Named directly in tests/network_roundtrip.rs (the client transport is generic over
# the HTTP client). Pinned to rmcp's reqwest line so cargo unifies on one copy; plain
# loopback HTTP needs no TLS provider, so keep default-features off.
reqwest = { version = "0.13", default-features = false }

[lints]
workspace = true
