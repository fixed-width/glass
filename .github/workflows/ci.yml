name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same ref supersedes in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # rustup installs the pinned toolchain + rustfmt from rust-toolchain.toml,
      # so CI formats with the same nightly the build uses.
      - name: Install pinned toolchain
        run: rustup show
      - run: cargo fmt --all --check

  check:
    name: build · clippy · test
    runs-on: ubuntu-latest
    # The Cargo workspace is at the repo root.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # rustup auto-installs the pinned toolchain + components from
      # rust-toolchain.toml (single source of truth for the nightly).
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: .
      # No display stack: every test that wants one is `#[ignore]`d, here and on a bare checkout.
      - run: cargo build --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  miri:
    name: Miri (UB check · pure crates)
    runs-on: ubuntu-latest
    # Miri interprets the MIR to catch undefined behaviour in the byte-level / unsafe-adjacent
    # logic we own. Scoped to the crates whose tests are Miri-clean: glass-clip-shim-windows (the private-
    # clipboard wire protocol + store) and glass-windows (pure pixel/dpi/jobpids byte parsing).
    # Miri cannot execute FFI / foreign functions, so the Win32 named-pipe server and the injected
    # user32 detours (cfg(windows)) are out of Miri's reach — those are covered on-box + by review.
    # The `miri` component is added here (not pinned in rust-toolchain.toml) so a future nightly
    # bump that lacks it fails only this job, not every job's `rustup show`.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pinned toolchain
        run: rustup show
      - name: Add miri component
        run: rustup component add miri
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: .
      - run: cargo miri test -p glass-clip-shim-windows -p glass-windows --locked

  x11:
    name: X11 integration (Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: .
      - name: Install system deps
        # bubblewrap: sandbox_* integration tests need unprivileged user namespaces.
        # Ubuntu 24.04 runners restrict them via AppArmor (bwrap then fails "setting up
        # uid map: Permission denied"), so re-enable them (no-op on images without the knob).
        # python3-gi + gir1.2-gtk-4.0: the software_render integration test drives a real GTK4 app.
        # zenity + at-spi2-core: the X11 suite needs a target app on PATH plus a running
        # AT-SPI bus for its accessibility tests; the runner ships neither by default.
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb bubblewrap python3-gi gir1.2-gtk-4.0 zenity at-spi2-core
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # glass-x11's display-backed unit tests are `#[ignore]`d; this is the job with a display.
      - run: cargo test -p glass-x11 --locked -- --include-ignored
      - run: ./scripts/test-x11.sh

  a11y:
    name: AT-SPI integration (a11y)
    runs-on: ubuntu-latest
    # Its own job rather than a step on the X11 one: the suite takes ~2 minutes, which is the
    # length of that job again, and every integration job runs in parallel. The three
    # `wayland_a11y_*` tests need a sway this job does not fetch, so they run on the Wayland job
    # and this one names them as skipped.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: .
      - name: Install system deps
        # The suite launches a real GTK4 app (python3-gi + gir1.2-gtk-4.0) under an X server it
        # starts itself, against glass's own private bus + AT-SPI registry (at-spi2-core).
        # bubblewrap, and the AppArmor knob Ubuntu 24.04 restricts it with, are for the four tests
        # that read the tree from inside a sandbox.
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb bubblewrap python3-gi gir1.2-gtk-4.0 at-spi2-core
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # This suite owns every Linux accessibility fact the repo asserts — which role a GTK switch
      # arrives as, whether an event subscription actually stops a wait re-walking — and until now
      # ran nowhere but a developer's machine.
      - run: ./scripts/test-a11y.sh

  wayland:
    name: Wayland integration (sway)
    runs-on: ubuntu-latest
    # Runs the #[ignore]d Wayland suite (scripts/test-wayland.sh) against a prebuilt
    # portable sway >=1.12 bundle from the sway-build repo's bundle-latest release
    # (cage was retired; Ubuntu only ships sway 1.9). The bundle is extracted into the
    # glass discovery location so test-wayland.sh finds it with zero config.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: .
      - name: Install system deps
        # The sway bundle resolves the Mesa/GL/EGL/gbm/drm stack from the host, so install
        # the GLVND loaders + Mesa software EGL/DRI (not just libgl1-mesa-dri). Plus Xwayland
        # for the app, and bubblewrap for sandbox_* — whose unprivileged user namespaces
        # Ubuntu 24.04 restricts via AppArmor, so re-enable them (no-op if the knob is absent).
        # zenity + at-spi2-core: the Wayland suite needs a target app on PATH plus a running
        # AT-SPI bus for its accessibility tests; the runner ships neither by default.
        run: |
          sudo apt-get update && sudo apt-get install -y \
            xwayland libegl1 libgl1 libgles2 libgbm1 libdrm2 libegl-mesa0 libgl1-mesa-dri bubblewrap \
            zenity at-spi2-core xvfb python3-gi gir1.2-gtk-4.0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Fetch prebuilt sway bundle
        run: |
          mkdir -p ~/.local/share/glass/sway
          curl -fsSL https://github.com/fixed-width/sway-build/releases/download/bundle-latest/sway-bundle-linux-x86_64.tar.gz \
            | tar -C ~/.local/share/glass/sway -xz
          ~/.local/share/glass/sway/bin/sway --version
      # glass-wayland's own unit tests, which start a compositor each and are `#[ignore]`d so a
      # bare `cargo test --workspace` needs none of this job's stack.
      - run: cargo test -p glass-wayland --locked -- --include-ignored
      - run: ./scripts/test-wayland.sh
      # The a11y suite's Wayland launch tests, which need this job's sway: the X11 job runs the
      # other 25 and names these as skipped.
      - run: ./scripts/test-a11y.sh wayland_a11y

  macos:
    name: macOS (build · clippy · test)
    runs-on: macos-14   # arm64 hosted runner
    # This is the only place cfg(target_os = "macos") code gets built + linted + tested — the
    # Linux job can't compile it. The capture/input/windows/a11y/bundle_launch integration
    # targets are harness = false and hard-fail without a granted, WindowServer-connected TCC
    # context, so they run on-box only; the runner covers pure macOS unit tests.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # rustup auto-installs the pinned toolchain + components from
      # rust-toolchain.toml (single source of truth for the nightly).
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: .
      # The Linux-only crates gate themselves off macOS (#293), so --workspace resolves here.
      - run: cargo build  --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Also builds the sandbox probe and the injected clip shim, which the tests need. Its own
      # `-p glass-macos --lib` run is repeated by the workspace step below — kept because this
      # script is the standalone entry point on a dev box, where nothing else runs them.
      - run: ./scripts/test-macos.sh
      # `--lib` rather than plain `--workspace`: it excludes the harness = false integration
      # targets, which need the TCC grants this runner lacks.
      - run: cargo test --workspace --lib --locked
      # Builds the Swift fixture (crates/glass-macos/fixture/a11y_fixture.swift) — the one
      # thing `cargo build --workspace --all-targets` above doesn't reach — and re-links the
      # harness=false `a11y` integration test (crates/glass-macos/tests/a11y.rs) as a belt-
      # and-braces check, without attempting the granted run (needs the Accessibility/Screen
      # Recording TCC grants and a WindowServer session the runner doesn't have; that happens
      # out-of-band — see the script's own comments and docs/how-to/build-from-source.md).
      - run: ./scripts/test-macos-a11y.sh
      - name: glass-mcp doctor sees the macos backend (TCC grants are absent on the runner)
        # `doctor` exits non-zero without the Screen Recording/Accessibility grants, which
        # the runner never has — expected, and NOT gated here (a hard exit-code gate would
        # permanently red this job). What IS gated: the default backend must still resolve
        # to "macos", proving the glass-macos wiring actually links and runs.
        run: |
          out="$(cargo run -p glass-mcp --locked -- doctor || true)"
          echo "$out"
          echo "$out" | grep -q "default backend: macos" || {
            echo "::error::glass-mcp doctor did not resolve the default backend to macos"
            exit 1
          }
      - name: glass-mcp headless stdio smoke (initialize + tools/list; no grants needed)
        run: ./scripts/test-macos-mcp.sh

  windows:
    name: Windows (build · clippy · test)
    runs-on: windows-latest
    # The Cargo workspace is at the repo root.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # rustup auto-installs the pinned toolchain from rust-toolchain.toml for the
      # x86_64-pc-windows-msvc host (MSVC linker ships on the runner).
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: .
      # The Linux-only and unix-only crates gate themselves (#293), so --workspace
      # resolves here. Keep all three steps --workspace: a hand-maintained `-p` list
      # stops compiling what it omits, so it hides the very failures that argue for
      # keeping it (#299 found 19 across three crates that way).
      - run: cargo build  --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test   --workspace --locked

  coverage:
    name: coverage (report-only)
    runs-on: ubuntu-latest
    # Non-gating: a coverage report, never a merge blocker. The number undercounts
    # by design (see scripts/coverage.sh): glass-windows Win32 FFI is
    # cfg(windows) so it isn't measured here; the Wayland suite needs a sway this job does not
    # fetch, so it self-skips, and glass-wayland's own tests are `#[ignore]`d for the same reason.
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pinned toolchain
        run: rustup show
      - name: Add llvm-tools (required by cargo-llvm-cov)
        run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@ed67fa35ac944f3a9b33f12c4dd43b6f31a47e20 # v2.83.3
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: .
      - name: Install system deps
        # xvfb + at-spi2-core: the X11 suite, plus the `#[ignore]`d glass-x11 unit tests
        # coverage.sh runs once it sees a display — absent, half the crate reports uncovered.
        # bubblewrap for the sandbox_* tests, whose unprivileged user namespaces Ubuntu 24.04
        # restricts via AppArmor (the sysctl is a no-op on images without the knob), and GTK4 for
        # the software_render test's real app.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb at-spi2-core bubblewrap python3-gi gir1.2-gtk-4.0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Measure coverage (unit + X11; Wayland/AT-SPI self-skip)
        run: ./scripts/coverage.sh --lcov
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: target/llvm-cov/glass.lcov
          if-no-files-found: warn

  mutants:
    name: Mutation shard ${{ matrix.shard }} (glass-core, glass-android, glass-x11)
    runs-on: ubuntu-latest
    # A push carries no base ref to diff against; this gate is a pull-request check.
    if: github.event_name == 'pull_request'
    strategy:
      # Every shard reports: one red shard must not hide a second one.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # `--in-diff` needs a merge base to diff against; the default depth-1 checkout has
          # none, which would yield an empty diff, mutate nothing, and pass green.
          fetch-depth: 0
      - name: Diff the gated crates against the merge base
        id: diff
        # A ref name may contain `;`, `` ` ``, `$` and more, so it reaches the shell as data.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1 || {
            echo "no merge base for origin/$BASE_REF — the checkout lacks history,"
            echo "so --in-diff would mutate nothing and this job would pass having gated nothing."
            exit 1
          }
          # `:(glob)` so `**` spans directories, matching scripts/mutants.sh's --file; without
          # it git reads `**` as an ordinary fnmatch pattern and selects nothing at all.
          #
          # Keep these pathspecs in step with the --package list below. --package is what sets
          # the --file glob, so a crate named there but absent here draws no mutants and gates
          # nothing, and one present here but not named there is never mutated at all.
          git diff "origin/$BASE_REF...HEAD" \
            -- ':(glob)crates/glass-core/src/**/*.rs' \
               ':(glob)crates/glass-android/src/**/*.rs' \
               ':(glob)crates/glass-x11/src/**/*.rs' > "$RUNNER_TEMP/pr.diff"
          wc -l "$RUNNER_TEMP/pr.diff"
          if [ -s "$RUNNER_TEMP/pr.diff" ]; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
            echo "this PR changes no .rs file under the gated crates' src/ — nothing to mutate"
          fi
      # Installing a toolchain and two cargo tools costs more than the check itself,
      # so a PR that touches no smoke file skips straight past them.
      - name: Install pinned toolchain
        if: steps.diff.outputs.touched == 'true'
        run: rustup show
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        if: steps.diff.outputs.touched == 'true'
        with:
          workspaces: .
      - uses: taiki-e/install-action@ed67fa35ac944f3a9b33f12c4dd43b6f31a47e20 # v2.83.3
        if: steps.diff.outputs.touched == 'true'
        with:
          tool: cargo-mutants,cargo-nextest
      - name: Install the X and a11y stack glass-x11's tests drive
        if: steps.diff.outputs.touched == 'true'
        # The mutation wrapper runs the `#[ignore]`d tests (see its header); absent either
        # package the unmutated baseline fails and the run grades nothing.
        run: sudo apt-get update && sudo apt-get install -y xvfb at-spi2-core
      - name: Mutation gate
        if: steps.diff.outputs.touched == 'true'
        # nextest runs each test in its own process, so slow tests overlap rather than sum.
        run: |
          scripts/mutants.sh "$RUNNER_TEMP/mutants" \
            --test-tool nextest \
            --package glass-core --package glass-android --package glass-x11 \
            --shard ${{ matrix.shard }}/8 --sharding round-robin \
            --in-diff "$RUNNER_TEMP/pr.diff"

  # A matrix job's checks are named per shard, so the branch ruleset has nothing stable
  # to require. This one has a fixed name and fails if any shard did.
  #
  # The ruleset's required check matches this name, so it is frozen — renaming it blocks every
  # pull request. It gates glass-android and glass-x11 too despite the name; rename only with
  # the ruleset.
  mutants-gate:
    name: Mutation gate (glass-core)
    runs-on: ubuntu-latest
    needs: mutants
    if: always()
    steps:
      - name: Collect the shard results
        env:
          RESULT: ${{ needs.mutants.result }}
        run: |
          # `skipped` is the push-event path, where the shards deliberately do not run.
          case "$RESULT" in
            success|skipped) echo "mutation shards: $RESULT" ;;
            *) echo "mutation shards: $RESULT — see the per-shard logs"; exit 1 ;;
          esac
